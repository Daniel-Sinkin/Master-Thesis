  <!-- Bottom annotations -->
  <text x="450" y="460" text-anchor="middle" class="label-xs" style="fill:#666;">Each bank contains DRAM cell arrays organized in rows × columns.</text>
  <text x="450" y="474" text-anchor="middle" class="label-xs" style="fill:#666;">A row activation opens one row into the sense amplifiers (row buffer); column access selects from the open row.</text>
  <text x="450" y="488" text-anchor="middle" class="label-xs" style="fill:#666;">Both PCs within a channel share clock and command inputs but have independent 64-bit data paths → effectively 2× parallelism per channel.</text>
  <text x="450" y="508" text-anchor="middle" class="annot">Channel pairs are assigned per die: e.g. Die 0 hosts Channels A+C, Die 1 hosts Channels B+D (see stack diagram)</text>
</svg>
