  <text x="450" y="48" text-anchor="middle" class="subtitle">Each core die hosts 2 channels; each channel has 2 pseudo channels (PCs) of 16 banks each</text>

  <!-- ===== DIE OUTLINE ===== -->
  <rect x="40" y="70" width="820" height="400" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="50" y="88" class="annot">Memory Core Die (one layer in the HBM2E stack)</text>

