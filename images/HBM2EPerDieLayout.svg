<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .title { font-size: 16px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #444; }
      .label { font-size: 11px; fill: #1a1a1a; font-weight: 600; }
      .label-sm { font-size: 9.5px; fill: #333; }
      .label-xs { font-size: 8px; fill: #555; }
      .annot { font-size: 10px; fill: #666; font-style: italic; }
    </style>
    <!-- Bank pattern: 2 rows of 8 banks -->
    <pattern id="bankGrid" x="0" y="0" width="32" height="22" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="30" height="20" rx="2" fill="#e8f0fe" stroke="#7baaf7" stroke-width="0.7"/>
